name: NEXORA quality gate

on:
  pull_request:
    paths:
      - "nexora/**"
      - ".github/workflows/nexora-quality-gate.yml"
  push:
    branches: [main]
    paths:
      - "nexora/**"
      - ".github/workflows/nexora-quality-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexora-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Server tests and production frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: nexora
    env:
      DATABASE_URL: postgresql://nexora_ci:nexora_ci@localhost:5432/nexora_ci?schema=public
      JWT_SECRET: ci-only-secret-that-is-not-used-for-production-123456
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root tooling
        run: npm install

      - name: Run backend syntax and regression tests
        run: npm run check --prefix server

      - name: Generate Prisma client and build frontend
        run: npm run build

      - name: Validate Prisma schema
        run: npx prisma validate --schema prisma/schema.prisma
