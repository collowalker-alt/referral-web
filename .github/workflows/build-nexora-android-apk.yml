name: Build NEXORA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'nexora/client/**'
      - '!nexora/client/public/downloads/nexora-android.apk'
      - '!nexora/client/public/app-version.json'
      - 'nexora/server/**'
      - 'nexora/prisma/**'
      - 'nexora/package.json'
      - '.github/workflows/build-nexora-android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VITE_API_URL: https://nexora-api-shxf.onrender.com/api
    steps:
      - name: Checkout NEXORA source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Install frontend dependencies
        working-directory: nexora/client
        run: npm install --no-audit --no-fund

      - name: Build React/Vite frontend
        working-directory: nexora/client
        run: npm run build

      - name: Keep APK download out of the app's bundled website
        run: if [ -f nexora/client/dist/downloads/nexora-android.apk ]; then rm -f nexora/client/dist/downloads/nexora-android.apk; fi

      - name: Generate Capacitor Android project
        working-directory: nexora/client
        run: npx cap add android

      - name: Sync web assets into Android project
        working-directory: nexora/client
        run: npx cap sync android

      - name: Apply NEXORA app branding
        working-directory: nexora
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python client/scripts/apply-android-branding.py \
            --android-dir client/android \
            --logo client/public/nexora-logo.png

      - name: Set a monotonic NEXORA app version
        working-directory: nexora/client/android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          p = Path('app/build.gradle')
          s = p.read_text()
          build = int(os.environ['BUILD_NUMBER'])
          s, n1 = re.subn(r'versionCode\s+\d+', f'versionCode {build}', s, count=1)
          s, n2 = re.subn(r'versionName\s+["\\'][^"\\']+["\\']', f'versionName "1.0.{build}"', s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'Could not set Android version (versionCode replacements={n1}, versionName replacements={n2})')
          p.write_text(s)
          print(f'Building NEXORA 1.0.{build} (versionCode {build})')
          PY

      - name: Build debug APK
        working-directory: nexora/client/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK output
        run: test -s nexora/client/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK for website downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p nexora/client/public/downloads
          cp nexora/client/android/app/build/outputs/apk/debug/app-debug.apk nexora/client/public/downloads/nexora-android.apk
          # Updates are deliberately disabled until a persistent signing key is configured.
          # Android rejects updates signed with a different key; never prompt users with an unusable APK.
          printf '{\n  "versionName": "1.0.%s",\n  "versionCode": %s,\n  "updateReady": false,\n  "apkUrl": "/downloads/nexora-android.apk",\n  "releaseNotes": "NEXORA app update"\n}\n' "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" > nexora/client/public/app-version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nexora/client/public/downloads/nexora-android.apk nexora/client/public/app-version.json
          if git diff --cached --quiet; then
            echo "The published APK is already up to date."
          else
            git commit -m "Publish official NEXORA Android APK [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexora-android-apk
          path: nexora/client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
