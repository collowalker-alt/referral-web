name: Build NEXORA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'nexora/client/**'
      - '!nexora/client/public/downloads/nexora-android.apk'
      - '!nexora/client/public/app-version.json'
      - 'nexora/server/**'
      - 'nexora/prisma/**'
      - 'nexora/package.json'
      - '.github/workflows/build-nexora-android-apk.yml'

permissions:
  contents: write

concurrency:
  group: nexora-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VITE_API_URL: https://nexora-api-shxf.onrender.com/api
      NEXORA_ANDROID_KEYSTORE_BASE64: ${{ secrets.NEXORA_ANDROID_KEYSTORE_BASE64 }}
      NEXORA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.NEXORA_ANDROID_KEYSTORE_PASSWORD }}
      NEXORA_ANDROID_KEY_ALIAS: ${{ secrets.NEXORA_ANDROID_KEY_ALIAS }}
      NEXORA_ANDROID_KEY_PASSWORD: ${{ secrets.NEXORA_ANDROID_KEY_PASSWORD }}
      NEXORA_AUTO_UPDATE_ENABLED: ${{ vars.NEXORA_AUTO_UPDATE_ENABLED }}
    steps:
      - name: Checkout NEXORA source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Install frontend dependencies
        working-directory: nexora/client
        run: npm install --no-audit --no-fund

      - name: Check NEXORA backend JavaScript syntax
        run: |
          node --check nexora/server/src/server.js
          node --check nexora/server/src/security-config.js
          node --check nexora/server/src/withdrawal-fees.js

      - name: Run backend regression tests
        run: npm test --prefix nexora/server

      - name: Build React/Vite frontend
        working-directory: nexora/client
        run: npm run build
 
      - name: Verify release artifacts and critical route contracts
        working-directory: nexora/client
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          root = Path("dist")
          index = root / "index.html"
          if not index.is_file() or index.stat().st_size == 0:
              raise SystemExit("Release gate failed: dist/index.html is missing or empty")
          html = index.read_text()
          assets = re.findall(r'(?:src|href)="(/[^"]+\.(?:js|mjs|css))"', html)
          if not assets:
              raise SystemExit("Release gate failed: no built JS/CSS assets referenced by index.html")
          missing = [asset for asset in assets if not (root / asset.lstrip("/")).is_file()]
          if missing:
              raise SystemExit("Release gate failed: missing built assets: " + ", ".join(missing))
          server = Path("../server/src/server.js").read_text()
          client = Path("src/main.jsx").read_text()
          required_server = ["/api/admin/reliability", "/api/admin/reconciliation", "/api/admin/universal-search", "/api/admin/users/:id/referrer"]
          required_client = ["AdminMissionControl", "nexora-service-draft:", "/admin/universal-search"]
          missing_contracts = [x for x in required_server if x not in server] + [x for x in required_client if x not in client]
          if missing_contracts:
              raise SystemExit("Release gate failed: critical route/UI contracts missing: " + ", ".join(missing_contracts))
          files = [p for p in root.rglob("*") if p.is_file() and p.suffix in (".js", ".mjs", ".css")]
          total = sum(p.stat().st_size for p in files)
          largest = sorted(files, key=lambda p: p.stat().st_size, reverse=True)[:5]
          print(f"Release artifact check passed: {len(assets)} entry assets; {len(files)} JS/CSS files; {total/1024:.1f} KiB total.")
          print("Largest bundles:")
          for p in largest:
              print(f"  {p.stat().st_size/1024:.1f} KiB  {p}")
          PY

      - name: Keep APK download out of the app's bundled website
        run: if [ -f nexora/client/dist/downloads/nexora-android.apk ]; then rm -f nexora/client/dist/downloads/nexora-android.apk; fi

      - name: Generate Capacitor Android project
        working-directory: nexora/client
        run: npx cap add android

      - name: Sync web assets into Android project
        working-directory: nexora/client
        run: npx cap sync android

      - name: Apply NEXORA app branding
        working-directory: nexora
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python client/scripts/apply-android-branding.py \
            --android-dir client/android \
            --logo client/public/nexora-logo.png

      - name: Set a monotonic NEXORA app version
        working-directory: nexora/client/android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          p = Path('app/build.gradle')
          s = p.read_text()
          build = int(os.environ['BUILD_NUMBER'])
          s, n1 = re.subn(r'versionCode\s+\d+', f'versionCode {build}', s, count=1)
          s, n2 = re.subn("versionName\\s+['\"][^'\"]+['\"]", f'versionName "1.0.{build}"', s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'Could not set Android version (versionCode replacements={n1}, versionName replacements={n2})')
          p.write_text(s)
          print(f'Building NEXORA 1.0.{build} (versionCode {build})')
          PY

      - name: Configure persistent APK signing when a keystore is configured
        working-directory: nexora/client/android
        run: |
          if [ -z "$NEXORA_ANDROID_KEYSTORE_BASE64" ]; then
            echo "No persistent signing key configured; building a debug-signed APK. In-app APK updates stay disabled."
            exit 0
          fi
          printf '%s' "$NEXORA_ANDROID_KEYSTORE_BASE64" | base64 --decode > app/nexora-upload.jks
          python - <<'PY'
          import re
          from pathlib import Path
          p = Path('app/build.gradle')
          s = p.read_text()
          if 'signingConfigs {\n        nexora {' not in s:
              marker = 'android {'
              if marker not in s:
                  raise SystemExit('Could not find android block in app/build.gradle')
              signing = '''android {
              signingConfigs {
                  nexora {
                      storeFile file("nexora-upload.jks")
                      storePassword System.getenv("NEXORA_ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("NEXORA_ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("NEXORA_ANDROID_KEY_PASSWORD")
                  }
              }
          '''
              s = s.replace(marker, signing, 1)
          match = re.search(r'buildTypes\s*\{', s)
          if not match:
              raise SystemExit('Could not find buildTypes block in app/build.gradle')
          insertion = '\n        debug { signingConfig signingConfigs.nexora }'
          if 'debug { signingConfig signingConfigs.nexora }' not in s:
              s = s[:match.end()] + insertion + s[match.end():]
          p.write_text(s)
          print('Configured persistent NEXORA signing key.')
          PY

      - name: Build debug APK
        working-directory: nexora/client/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK output
        run: test -s nexora/client/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK for website downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p nexora/client/public/downloads
          cp nexora/client/android/app/build/outputs/apk/debug/app-debug.apk nexora/client/public/downloads/nexora-android.apk
          # Do not offer APK updates until the permanent signing key is set and the first stable-signed APK has been installed manually.
          update_ready=false
          if [ -n "$NEXORA_ANDROID_KEYSTORE_BASE64" ] && [ "$NEXORA_AUTO_UPDATE_ENABLED" = "true" ]; then update_ready=true; fi
          printf '{\n  "versionName": "1.0.%s",\n  "versionCode": %s,\n  "updateReady": %s,\n  "apkUrl": "/downloads/nexora-android.apk",\n  "releaseNotes": "NEXORA app update"\n}\n' "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" "$update_ready" > nexora/client/public/app-version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nexora/client/public/downloads/nexora-android.apk nexora/client/public/app-version.json
          if [ -f nexora/client/android/app/nexora-upload.jks ]; then rm -f nexora/client/android/app/nexora-upload.jks; fi
          if git diff --cached --quiet; then
            echo "The published APK is already up to date."
          else
            git commit -m "Publish official NEXORA Android APK [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexora-android-apk
          path: nexora/client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
