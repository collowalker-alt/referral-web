<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/png" sizes="64x64" href="/favicon.png"><link rel="apple-touch-icon" href="/nexora-logo.png"><meta name="theme-color" content="#050a12"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0b0d12"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="icon" href="/nexora-logo.png"><title>NEXORA — Connect. Grow. Earn.</title></head><body><div id="root"></div><script type="module" src="/src/main.jsx"></script><script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", async () => {
    try {
      const registration = await navigator.serviceWorker.register("/sw.js");
      registration.update().catch(() => {});
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (navigator.onLine && !window.__nexoraControllerReloaded) {
          window.__nexoraControllerReloaded = true;
          window.location.reload();
        }
      });
    } catch {}
  });
  window.addEventListener("online", () => {
    navigator.serviceWorker.getRegistration().then(registration => {
      if (registration) registration.update().catch(() => {});
    }).catch(() => {});
    // Refresh the online app shell after reconnecting so newly deployed files are picked up.
    if (!window.__nexoraReconnectReloaded) {
      window.__nexoraReconnectReloaded = true;
      window.location.reload();
    }
  });
}</script></body></html>
