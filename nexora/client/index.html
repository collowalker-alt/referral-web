    <link rel="preconnect" href="https://nexora-api-shxf.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="//nexora-api-shxf.onrender.com" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/nexora-logo.png" />
    <link rel="icon" href="/nexora-logo.png" />

    <style id="nexora-header-stability-fix">
      /* Keep the member header identical before and after scrolling. */
      .app>main>header.member-sticky-header,
      .app>main>header.member-sticky-header.compact{
        height:82px!important;min-height:82px!important;max-height:82px!important;
        padding-top:0!important;padding-bottom:0!important;
        box-sizing:border-box!important;
      }
      .app>main>header.member-sticky-header .memberpagetitle .muted,
      .app>main>header.member-sticky-header.compact .memberpagetitle .muted{
        display:block!important;visibility:visible!important;opacity:1!important;
        white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;
        font-size:10px!important;line-height:1.35!important;
      }
      .app>main>header.member-sticky-header .nx-back-to-top,
      .app>main>header.member-sticky-header .nx-header-back-to-top,
      .nx-back-to-top,.nx-header-back-to-top{
        position:fixed!important;right:13px!important;bottom:142px!important;
        z-index:260!important;flex:none!important;grid-column:auto!important;
      }
      @media(max-width:760px){
        .app>main>header.member-sticky-header,
        .app>main>header.member-sticky-header.compact{
          height:68px!important;min-height:68px!important;max-height:68px!important;
        }
        .app>main>header.member-sticky-header .memberpagetitle .muted,
        .app>main>header.member-sticky-header.compact .memberpagetitle .muted{
          display:block!important;font-size:9px!important;line-height:1.3!important;
        }
        .app>main>header.member-sticky-header .nx-back-to-top,
        .app>main>header.member-sticky-header .nx-header-back-to-top,
        .nx-back-to-top,.nx-header-back-to-top{
          right:13px!important;bottom:142px!important;
        }
      }
      @media(min-width:761px){.nx-back-to-top,.nx-header-back-to-top{right:18px!important;bottom:94px!important}}
    </style>
    <title>NEXORA — Connect. Grow. Earn.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (() => {
        if (!("serviceWorker" in navigator)) return;

        let reloadAfterUpdate = false;

        navigator.serviceWorker.addEventListener("controllerchange", () => {
          // Reload only when a newly installed worker takes control, not on every
          // network reconnect. This prevents reload loops and lets cached UI stay open.
          if (navigator.onLine && reloadAfterUpdate && !window.__nexoraUpdateReloaded) {
            window.__nexoraUpdateReloaded = true;
            window.location.reload();
          }
          reloadAfterUpdate = false;
        });

        async function checkForUpdates() {
          try {
            const registration = await navigator.serviceWorker.getRegistration("/");
            if (registration) {
              reloadAfterUpdate = true;
              await registration.update();
            }
          } catch {
            // Offline checks are expected to fail quietly.
          }
        }

        window.addEventListener("load", async () => {
          try {
            const registration = await navigator.serviceWorker.register("/sw.js", { updateViaCache: "none" });
            reloadAfterUpdate = true;
            registration.update().catch(() => {});
          } catch {
            // The app should still load if service workers are unavailable.
          }
        });

        window.addEventListener("online", () => {
          // Check the deployed service worker; its install/activate flow replaces
          // the cached shell safely, then controllerchange reloads the new version.
          checkForUpdates();
        });
      })();
    </script>
  </body>
</html>
